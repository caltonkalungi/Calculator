<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="calculator">

    <div class="display" id="display">0</div>

    <div class="keys">

      <button class="gray" onclick="clearAll()">AC</button>
      <button onclick="pressKey('00')">00</button>
      <button onclick="pressKey('%')">%</button>
      <button class="orange" onclick="pressKey('/')">÷</button>

      <button onclick="pressKey('7')">7</button>
      <button onclick="pressKey('8')">8</button>
      <button onclick="pressKey('9')">9</button>
      <button class="orange" onclick="pressKey('*')">x</button>

      <button onclick="pressKey('4')">4</button>
      <button onclick="pressKey('5')">5</button>
      <button onclick="pressKey('6')">6</button>
      <button class="orange" onclick="pressKey('-')">−</button>

      <button onclick="pressKey('1')">1</button>
      <button onclick="pressKey('2')">2</button>
      <button onclick="pressKey('3')">3</button>
      <button class="orange" onclick="pressKey('+')">+</button>

      <button class="zero" onclick="pressKey('0')">0</button>
      <button onclick="pressKey('.')">.</button>
      <button class="orange" onclick="calculate()">=</button>

    </div>
  </div>

</body>
</html>
